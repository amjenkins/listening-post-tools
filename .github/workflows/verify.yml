name: Verify macro indicators

on:
  schedule:
    # 21:30 UTC = 4:30pm EDT (UTC-4) or 4:30pm EST is 21:30 UTC... see note.
    # Deliberately picked so it needs NO seasonal (DST) adjustment, unlike
    # the Listening Post's own Morning/Evening triggers: 21:30 UTC is
    # 5:30pm ET during EDT and 4:30pm ET during EST — after the 4:00pm ET
    # close either way, so this one cron line is correct year-round.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run verification
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python3 verify_indicators.py

      - name: Commit result
        run: |
          git config user.name "listening-post-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No change in data/latest.json — nothing to commit."
          else
            git commit -m "Update macro indicators verification $(date -u +%Y-%m-%d)"
            git push
          fi
